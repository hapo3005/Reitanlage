name: One-shot GitHub Actions modernization

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-actions-update.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Upgrade pinned workflow actions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/deploy-current.yml')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  'actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4',
                  'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1',
                  1,
              ),
              (
                  'actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5',
                  'actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0',
                  1,
              ),
              (
                  'actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4',
                  'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1',
                  2,
              ),
              (
                  'actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4',
                  'actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0',
                  1,
              ),
          ]

          for old, new, expected in replacements:
              actual = text.count(old)
              if actual != expected:
                  raise SystemExit(f'Expected {expected} occurrence(s) of {old!r}, found {actual}')
              text = text.replace(old, new)

          path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          git diff -- .github/workflows/deploy-current.yml

      - name: Commit modernization
        shell: bash
        run: |
          if git diff --quiet -- .github/workflows/deploy-current.yml; then
            echo 'No update required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/deploy-current.yml
          git commit -m 'Modernize pinned GitHub Actions runtime'
          git push origin HEAD:main
