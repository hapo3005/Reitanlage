name: Deploy current Reitanlage

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: reitanlage-direct-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build production site
        run: python build-site.py

      - name: Verify production artifact
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          html = Path('index.html').read_text(encoding='utf-8')
          assert '<section class="legal"' not in html
          assert 'href="impressum.html">Impressum</a>' in html
          assert 'href="datenschutz.html">Datenschutz</a>' in html
          assert html.count('rel="stylesheet"') == 1
          assert 'site.css?v=' in html
          assert 'site.js?v=' in html
          assert 'property="og:url"' in html
          assert 'loading="lazy"' in html
          assert Path('site.css').stat().st_size > 50000
          assert Path('site.js').stat().st_size > 5000
          assert Path('robots.txt').exists()
          assert Path('sitemap.xml').exists()
          print('Production artifact checks passed.')
          PY

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy production site
        id: deployment
        uses: actions/deploy-pages@v4
