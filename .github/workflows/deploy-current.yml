name: Deploy current Reitanlage

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: reitanlage-direct-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare current asset versions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, re

          token = os.environ["GITHUB_SHA"][:12]

          index = Path("index.html")
          html = index.read_text(encoding="utf-8")
          html = re.sub(
              r'<link rel="preload" as="image" href="images/reitbeteiligung1\.png"><link rel="stylesheet" href="rebuild\.css\?v=[^"]+"><link rel="stylesheet" href="contact-finish\.css\?v=[^"]+">',
              f'<link rel="preload" as="image" href="images/reitbeteiligung1.png"><link rel="stylesheet" href="rebuild.css?v={token}">',
              html,
          )
          html = re.sub(r'rebuild\.css\?v=[^"\']+', f'rebuild.css?v={token}', html)
          index.write_text(html, encoding="utf-8")

          rebuild = Path("rebuild.css")
          css = rebuild.read_text(encoding="utf-8")
          css = re.sub(r'\?v=[^"\)]+', f'?v={token}', css)
          rebuild.write_text(css, encoding="utf-8")
          PY
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
