name: Deploy current Reitanlage

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: reitanlage-direct-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check "Pillow>=11,<13"

      - name: Build production release
        run: |
          python build-release.py
          python build-journal.py

      - name: Verify production artifact
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json

          out = Path('_site')
          html = (out / 'index.html').read_text(encoding='utf-8')
          journal = (out / 'aktuelles.html').read_text(encoding='utf-8')
          sitemap = (out / 'sitemap.xml').read_text(encoding='utf-8')
          news = json.loads((out / 'aktuelles.json').read_text(encoding='utf-8'))

          assert '<section class="legal"' not in html
          assert 'href="impressum.html">Impressum</a>' in html
          assert 'href="datenschutz.html">Datenschutz</a>' in html
          assert 'Facebook-Gruppe ↗' not in html
          assert 'Nach oben ↑' not in html
          assert html.count('rel="stylesheet"') == 1
          assert 'site.css?v=' in html
          assert 'site.js?v=' in html
          assert 'favicon.svg' in html
          assert 'site.webmanifest' in html
          assert 'social-preview.jpg' in html
          assert 'property="og:image:width" content="1200"' in html
          assert 'property="og:image:height" content="630"' in html
          assert 'loading="lazy"' in html
          assert '.webp' in html
          assert 'href="aktuelles.html">Aktuelles</a>' in html
          assert 'Alle Neuigkeiten &amp; Rückblicke' in html
          assert all(str(item.get('image', '')).endswith('.webp') for item in news.get('items', []))

          assert '<body class="journal-page">' in journal
          assert 'Aktuelles &amp; Hofleben' in journal or 'Aktuelles & Hofleben' in journal
          assert 'Das PM-Mobil zu Gast' in journal
          assert 'Ferienreitkurs im März' in journal
          assert 'images/reistunde1' in journal and '.webp' in journal
          assert 'srcset=' in journal
          assert 'site.css?v=' in journal
          assert 'site.js?v=' in journal
          assert 'aktuelles.html' in sitemap

          assert (out / 'site.css').stat().st_size > 55000
          assert (out / 'site.js').stat().st_size > 5000
          assert (out / 'images/reitbeteiligung1-480.webp').stat().st_size < 150_000
          assert (out / 'images/flyerferienreitkurs.webp').stat().st_size < 1_100_000
          assert (out / 'images/reistunde1.webp').exists()
          assert (out / 'images/flyerferienreitskurs2.webp').exists()
          assert (out / 'images/frohefeiertage.webp').exists()
          assert Image.open(out / 'images/eventbild4.webp').width >= 400
          assert Image.open(out / 'images/schulpferd1.webp').width >= 400
          assert Image.open(out / 'social-preview.jpg').size == (1200, 630)
          assert (out / 'robots.txt').exists()
          assert (out / 'sitemap.xml').exists()
          assert (out / '404.html').exists()
          assert not list(out.glob('*.py'))
          assert not list(out.glob('*.md'))
          total = sum(p.stat().st_size for p in out.rglob('*') if p.is_file())
          assert total < 7_500_000, total
          print(f'Production artifact checks passed: {total / 1024 / 1024:.2f} MiB.')
          PY

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy production site
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live release
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          token="${GITHUB_SHA:0:12}"
          for attempt in {1..12}; do
            page="$(curl -fsSL "${PAGE_URL}?v=${GITHUB_SHA}" || true)"
            journal="$(curl -fsSL "${PAGE_URL}aktuelles.html?v=${GITHUB_SHA}" || true)"
            if grep -q "site.css?v=${token}" <<<"$page" && grep -q "site.css?v=${token}" <<<"$journal" && grep -q "Das PM-Mobil zu Gast" <<<"$journal"; then
              curl -fsSL "${PAGE_URL}social-preview.jpg" -o /tmp/social-preview.jpg
              test -s /tmp/social-preview.jpg
              echo "Live release ${token}, including Hofjournal, verified."
              exit 0
            fi
            sleep 3
          done
          echo "Live release verification timed out." >&2
          exit 1
