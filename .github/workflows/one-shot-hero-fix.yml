name: One-shot desktop hero repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-hero-fix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair final desktop hero cascade
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('styles/site.css')
          css = path.read_text(encoding='utf-8')
          marker = '/* ===== homepage-premium-final.css ===== */'
          if css.count(marker) != 1:
              raise SystemExit('Expected exactly one homepage-premium-final marker')

          before, final = css.split(marker, 1)
          old = "    min-height:100svh!important;\n    gap:clamp(40px,4vw,72px)!important;"
          new = "    min-height:0!important;\n    gap:clamp(40px,4vw,72px)!important;"
          if final.count(old) != 1:
              raise SystemExit('Expected exactly one final desktop hero min-height rule')

          final = final.replace(old, new, 1)
          path.write_text(before + marker + final, encoding='utf-8')
          PY

          git diff --check
          git diff -- styles/site.css

      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet -- styles/site.css; then
            echo 'No repair required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add styles/site.css
          git commit -m 'Fix desktop hero cascade and above-fold transition'
          git push origin HEAD:main
