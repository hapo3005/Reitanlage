name: One-shot wide desktop hero clearance repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-wide-hero-fix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Give short wide desktops safe header clearance
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('styles/site.css')
          css = path.read_text(encoding='utf-8')
          marker = '/* ===== homepage-premium-final.css ===== */'
          if css.count(marker) != 1:
              raise SystemExit('Expected exactly one homepage-premium-final marker')

          before, final = css.split(marker, 1)
          old = 'padding:clamp(118px,13vh,138px) max(36px,calc((100vw - 1780px)/2)) clamp(34px,4vh,44px)!important;'
          new = 'padding:clamp(136px,13vh,138px) max(36px,calc((100vw - 1780px)/2)) clamp(34px,4vh,44px)!important;'
          if final.count(old) != 1:
              raise SystemExit('Expected exactly one final desktop hero padding rule')

          final = final.replace(old, new, 1)
          path.write_text(before + marker + final, encoding='utf-8')
          PY

          git diff --check
          git diff -- styles/site.css

      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet -- styles/site.css; then
            echo 'No repair required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add styles/site.css
          git commit -m 'Give wide desktop hero safe header clearance'
          git push origin HEAD:main
